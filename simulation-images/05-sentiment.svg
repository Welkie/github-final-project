<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Segoe UI, Arial, sans-serif"><rect width="900" height="520" fill="#f4f9ff"/>
<defs><marker id="a" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto"><path d="M0 0L16 8L0 16z" fill="#1b4b8f"/></marker></defs>
<text x="450" y="50" font-size="30" font-weight="bold" text-anchor="middle" fill="#1b4b8f">🤖 Phân tích cảm xúc = Robot đoán tâm trạng</text>
<text x="450" y="82" font-size="18" text-anchor="middle" fill="#456">Robot đọc lời nhận xét và đoán: vui, buồn hay bình thường?</text>
<rect x="40" y="150" width="240" height="120" rx="20" fill="#fff" stroke="#e0527a" stroke-width="3"/>
<text x="160" y="190" font-size="14" text-anchor="middle" fill="#888">Khách viết:</text>
<text x="160" y="228" font-size="24" font-weight="bold" text-anchor="middle">"Fantastic services"</text>
<text x="160" y="255" font-size="14" text-anchor="middle" fill="#888">(Dịch vụ tuyệt vời)</text>
<path d="M285 210 H350" stroke="#1b4b8f" stroke-width="5" marker-end="url(#a)"/>
<rect x="355" y="130" width="190" height="160" rx="20" fill="#d9ecff" stroke="#2f80ed" stroke-width="3"/>
<text x="450" y="205" font-size="70" text-anchor="middle">🤖</text>
<text x="450" y="245" font-size="16" font-weight="bold" text-anchor="middle">Flask + máy học</text>
<text x="450" y="268" font-size="13" text-anchor="middle">thấy từ "fantastic" = từ vui!</text>
<path d="M550 210 H615" stroke="#1b4b8f" stroke-width="5" marker-end="url(#a)"/>
<rect x="620" y="150" width="240" height="120" rx="20" fill="#d8f5dc" stroke="#27ae60" stroke-width="3"/>
<text x="740" y="210" font-size="56" text-anchor="middle">😀</text>
<text x="740" y="248" font-size="22" font-weight="bold" text-anchor="middle" fill="#1f8a4c">positive</text>
<g font-size="18" text-anchor="middle"><rect x="60" y="330" width="240" height="90" rx="14" fill="#d8f5dc"/><text x="180" y="365" font-size="34">😀</text><text x="180" y="400">positive = vui</text>
<rect x="330" y="330" width="240" height="90" rx="14" fill="#f0f0f0"/><text x="450" y="365" font-size="34">😐</text><text x="450" y="400">neutral = bình thường</text>
<rect x="600" y="330" width="240" height="90" rx="14" fill="#ffe3e3"/><text x="720" y="365" font-size="34">😞</text><text x="720" y="400">negative = buồn</text></g>
<text x="450" y="470" font-size="16" text-anchor="middle" fill="#666">Kết quả trả về: {"sentiment": "positive"}</text>
</svg>
